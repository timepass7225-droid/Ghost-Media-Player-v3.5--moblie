name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "App folder: $DIR"
          cd "$DIR"
          npm install
          npx cap add android
          npm run build
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-APK
          path: '**/app-debug.apk'
